name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    name: Test, lint & debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install locked web dependencies
        run: npm ci

      - name: Run native unit tests, Android lint and build debug APK
        run: |
          set +e
          gradle_version=$(gradle --version | awk '/^Gradle / { print $2 }')
          if [[ "$gradle_version" != "9.8.2" ]]; then
            echo "::error::Runner Gradle is $gradle_version; expected the repository-pinned 9.8.2"
            exit 1
          fi
          gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            message=$({
              grep -E 'FAILURE:|What went wrong|Execution failed|BUILD FAILED|(^| )error:|^e: |Caused by:|Lint found' "$RUNNER_TEMP/gradle-build.log" | tail -n 25
              echo '--- final output ---'
              tail -n 25 "$RUNNER_TEMP/gradle-build.log"
            } | sed -E $'s/\\x1B\\[[0-9;]*[mK]//g')
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$message"
            exit "$status"
          fi

      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@v7
        with:
          name: nokkhotro-android-debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.sarif
            android/app/build/test-results/testDebugUnitTest/
