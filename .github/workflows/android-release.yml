name: Android signed AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: number
      version_name:
        description: Public version name, for example 1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  signed-bundle:
    name: Verify & build signed release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install locked web dependencies
        run: npm ci

      - name: Validate release inputs and signing secrets
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version_name must resemble 1.2.3"
            exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure all four Android upload-signing repository secrets before running this workflow"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nokkhotro-upload.jks"
          chmod 600 "$RUNNER_TEMP/nokkhotro-upload.jks"
          test -s "$RUNNER_TEMP/nokkhotro-upload.jks"

      - name: Test, lint and build signed release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nokkhotro-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gradle_version=$(gradle --version | awk '/^Gradle / { print $2 }')
          if [[ "$gradle_version" != "9.8.2" ]]; then
            echo "::error::Runner Gradle is $gradle_version; expected the repository-pinned 9.8.2"
            exit 1
          fi
          gradle -p android --no-daemon \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            testReleaseUnitTest lintRelease bundleRelease

      - name: Verify bundle signature and checksum
        run: |
          BUNDLE="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$BUNDLE"
          jarsigner -verify -verbose -certs "$BUNDLE" | tee "$RUNNER_TEMP/jarsigner-output.txt"
          grep -q "jar verified." "$RUNNER_TEMP/jarsigner-output.txt"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"

      - name: Upload Play Console bundle
        uses: actions/upload-artifact@v7
        with:
          name: nokkhotro-play-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
            android/app/build/outputs/mapping/release/mapping.txt
